[project]
name = "verdict"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
# The verifier, loaders and audit need only sqlglot. GPU training is an extra
# so tests and CI do not have to install torch.
dependencies = [
    "sqlglot>=25.0",
]

[project.optional-dependencies]
# The product engine: file uploads (pandas, openpyxl), the Gemini SQL writer,
# the API server (fastapi, uvicorn, python-multipart for uploads) and
# similar-question search for the knowledge store (scikit-learn TF-IDF).
app = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4",
    # Password hashing for analyst and provider accounts.
    "bcrypt>=4.1",
    # CPU, memory and disk figures for the provider's statistics page.
    "psutil>=5.9",
]
train = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0",
    # FastAPI's TestClient runs on httpx.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
