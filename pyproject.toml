[project]
name = "verdict"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlglot>=25.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "trl>=0.8.0",
    "unsloth",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.43.0",
    "peft>=0.8.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
